<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Várzea Online</title>
<style>
body{
  margin:0;
  height:100vh;
  background:#0e5f30;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial;
  color:white;
}
.box{
  text-align:center;
}
button{
  display:block;
  margin:20px auto;
  padding:15px 40px;
  font-size:18px;
  border-radius:12px;
  border:none;
  cursor:pointer;
}
.desktop{
  background:#1e8c45;
  color:white;
}
.mobile{
  background:#0c7036;
  color:white;
}
</style>
</head>
<body>

<div class="box">
  <h1>Escolha sua versão</h1>

  <button onclick="selectDevice('desktop')">
    🖥 Versão Desktop
  </button>

  <button onclick="selectDevice('mobile')">
    📱 Versão Mobile
  </button>
</div>

<script>
// Limpa qualquer modo antigo
localStorage.clear();

function selectDevice(mode) {
  localStorage.setItem("deviceMode", mode);

  if (mode === "mobile") {
    window.location.href = "/lobby-mobile.html";
  } else {
    window.location.href = "/lobby.html";
  }
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Controle de Salas</title>
  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#111827;
      color:white;
      padding:24px;
    }

    h1{
      margin-top:0;
    }

    .topbar{
      display:flex;
      gap:10px;
      margin-bottom:20px;
      align-items:center;
    }

    input{
      padding:10px;
      border-radius:8px;
      border:0;
      width:220px;
    }

    button{
      padding:10px 14px;
      border:0;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:#1f2937;
      border-radius:12px;
      overflow:hidden;
    }

    th, td{
      border-bottom:1px solid #374151;
      padding:10px;
      text-align:left;
      vertical-align:top;
      font-size:14px;
    }

    th{
      background:#0f172a;
    }

    .open{
      color:#22c55e;
      font-weight:bold;
    }

    .closed{
      color:#ef4444;
      font-weight:bold;
    }

    details{
      cursor:pointer;
    }

    .access{
      margin-bottom:6px;
      color:#d1d5db;
      font-size:13px;
    }
  </style>
</head>
<body>

  <h1>Controle de Salas</h1>

  <div class="topbar">
    <input id="senha" type="password" placeholder="Senha do painel">
    <button onclick="loadRooms()">Atualizar</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Sala</th>
        <th>Status</th>
        <th>Abertura</th>
        <th>Duração</th>
        <th>Azul</th>
        <th>Vermelho</th>
        <th>Espectadores</th>
        <th>Acessos</th>
      </tr>
    </thead>
    <tbody id="roomsBody">
      <tr>
        <td colspan="8">Digite a senha e clique em atualizar.</td>
      </tr>
    </tbody>
  </table>

  <script>
    async function loadRooms(){
      const senha = document.getElementById("senha").value.trim();
      const tbody = document.getElementById("roomsBody");

      if(!senha){
        alert("Digite a senha.");
        return;
      }

      try{
        const res = await fetch(`/api/dev-salas?senha=${encodeURIComponent(senha)}`);
        const data = await res.json();

        if(!res.ok){
          tbody.innerHTML = `<tr><td colspan="8">Acesso negado.</td></tr>`;
          return;
        }

        if(data.length === 0){
          tbody.innerHTML = `<tr><td colspan="8">Nenhuma sala registrada.</td></tr>`;
          return;
        }

        tbody.innerHTML = data.map(room => {
          const statusClass = room.status === "aberta" ? "open" : "closed";

          const accesses = room.accesses.map(a => `
            <div class="access">
              ${new Date(a.at).toLocaleString()} —
              ${a.name} (${a.role}) —
              ${a.action}
            </div>
          `).join("");

          return `
            <tr>
              <td>${room.roomCode}</td>
              <td class="${statusClass}">${room.status}</td>
              <td>${room.createdAt ? new Date(room.createdAt).toLocaleString() : "-"}</td>
              <td>${room.duration}</td>
              <td>${room.players.blue || "-"}</td>
              <td>${room.players.red || "-"}</td>
              <td>${room.spectators.length ? room.spectators.join(", ") : "-"}</td>
              <td>
                <details>
                  <summary>${room.accesses.length} registros</summary>
                  ${accesses || "Sem acessos"}
                </details>
              </td>
            </tr>
          `;
        }).join("");

      }catch(err){
        tbody.innerHTML = `<tr><td colspan="8">Erro ao carregar dados.</td></tr>`;
      }
    }

    setInterval(() => {
      const senha = document.getElementById("senha").value.trim();
      if(senha) loadRooms();
    }, 10000);
  </script>

</body>
</html>
